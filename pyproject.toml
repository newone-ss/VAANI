[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bite-me"
version = "1.0.0"
description = "AI-Powered Real-Time Voice Impersonation & Executive Deepfake Detection Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Enterprise Security License" }
authors = [
    { name = "BiTe_me SecOps Team" }
]
keywords = [
    "deepfake-detection",
    "voice-biometrics",
    "audio-security",
    "sip-trunk",
    "fastapi",
    "onnx",
    "real-time",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security :: Cryptography",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.24.3",
    "scipy>=1.11.0",
    "onnxruntime>=1.16.0",
    "cryptography>=41.0.0",
    "httpx>=0.25.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "transformers>=4.30.0",
    "onnx>=1.14.0",
    "onnxscript>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
